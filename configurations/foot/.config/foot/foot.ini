# Start flavours
# Base16 Kanagawa - foot color config
# Originally by rebelot(https://github.com/rebelot), ported by montdor (https://github.com/montdor)
[colors]
background=1f1f28
foreground=dcd7ba

# Normal colors
regular0=1f1f28 # Black, could also be base01
regular1=c34043 # Red
regular2=98bb6c # Green
regular3=dca561 # Yellow
regular4=7e9cd8 # Blue
regular5=957fb8 # Magenta
regular6=7fb4ca # Cyan
regular7=dcd7ba # White

# Bright colors
bright0=727169
bright1=ffa066
bright2=2a2a37
bright3=223249
bright4=c8c093
bright5=938aa9
bright6=d27e99
bright7=363646
